name: Stock Data Cronjob

on:
  schedule:
    - cron: "0 3 * * 1-5"   # 03:00 UTC = 08:30 IST (early trigger to beat GitHub delay)
  workflow_dispatch:

permissions:
  contents: write

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 360

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Cache pip
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('requirements.txt') }}
          restore-keys: ${{ runner.os }}-pip-

      - name: Install dependencies
        run: pip install --quiet -r requirements.txt

      - name: Configure git
        run: |
          git config --global user.name  "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"

      - name: Run per-minute loop
        env:
          TV_USERNAME: ${{ secrets.TV_USERNAME }}
          TV_PASSWORD: ${{ secrets.TV_PASSWORD }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python - <<'EOF'
          import subprocess, sys, time
          from datetime import datetime
          import pytz

          IST = pytz.timezone("Asia/Kolkata")
          INTERVAL = 60  # seconds between runs

          def git_sync():
              import os
              os.makedirs("data", exist_ok=True)
              subprocess.run(["git", "add", "-f", "data/option_chain.db", "README.md"], check=False)
              result = subprocess.run(["git", "diff", "--cached", "--quiet"])
              if result.returncode != 0:
                  now_str = datetime.now(IST).strftime("%Y-%m-%d %H:%M IST")
                  subprocess.run(["git", "commit", "-m", f"chore: auto-update {now_str}"], check=False)
              subprocess.run(["git", "fetch", "origin", "main"], check=False)
              subprocess.run(["git", "rebase", "origin/main"], check=False)
              subprocess.run(["git", "push", "origin", "main"], check=False)

          def run_and_sync():
              subprocess.run([sys.executable, "-m", "src.fetch_option_chain"], timeout=90)
              subprocess.run([sys.executable, "-m", "src.readme_generator"], timeout=30)
              git_sync()

          print("Loop started", flush=True)
          now = datetime.now(IST)
          if now.weekday() >= 5 or now.hour * 100 + now.minute > 1530:
              print(f"[{now.strftime('%H:%M IST')}] Market closed — nothing to do", flush=True)
              sys.exit(0)

          while True:
              now = datetime.now(IST)
              hm  = now.hour * 100 + now.minute
              if hm > 1530:
                  print(f"[{now.strftime('%H:%M IST')}] Market closed — exiting", flush=True)
                  break
              if hm < 915:
                  wait = (915 - hm) * 60 - now.second
                  print(f"[{now.strftime('%H:%M IST')}] Pre-market, sleeping {wait}s", flush=True)
                  time.sleep(wait)
                  continue

              next_run = time.monotonic() + INTERVAL
              print(f"[{now.strftime('%H:%M:%S IST')}] Running pipeline...", flush=True)
              try:
                  run_and_sync()
              except Exception as e:
                  print(f"Pipeline error: {e}", flush=True)

              sleep_for = next_run - time.monotonic()
              if sleep_for > 0:
                  time.sleep(sleep_for)
          EOF
